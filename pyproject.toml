[project]
name = "simpli-review"
version = "0.1.0"
description = "AI pull-request reviewer with whole-codebase context, run as a GitHub Action."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simpli Software" }]
dependencies = [
    "anthropic>=0.70",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.14", "types-PyYAML"]

[project.urls]
Homepage = "https://github.com/simpli-software/simpli-review"
Issues = "https://github.com/simpli-software/simpli-review/issues"
Source = "https://github.com/simpli-software/simpli-review"

[project.scripts]
simpli-review = "simpli_review.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
# Review-benchmark fixtures are deliberately flawed sample projects, not code of this package.
extend-exclude = ["evals/cases"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# YAML text that mirrors examples/*.yml, kept verbatim.
"src/simpli_review/init_templates.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
